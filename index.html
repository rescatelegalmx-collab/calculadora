 de confianza?",help:"Un organismo con nombre propio (la ley les dice descentralizados) es una institución del gobierno que tiene su propio nombre, su propio presupuesto y su propio patrimonio. Si trabajas en uno de esos, elige una de las dos primeras opciones aunque además seas de base o de confianza.",ops:[{l:"Trabajo en el IMSS, PEMEX o CFE",next:"resDesc"},{l:"Trabajo en una universidad pública o en otro organismo con nombre propio",next:"resISSSTEConfianza"},{l:"No: soy trabajador de base o sindicalizado en una dependencia de gobierno",next:"resISSSTE"},{l:"Sí: tengo puesto de confianza, mando o dirección en una dependencia de gobierno",next:"resISSSTEConfianza"}]},sinSeguro:{q:"Entendido. ¿Y quién te paga tu sueldo?",help:"Trabajar sin seguro NO borra tus derechos — al contrario, suma reclamos. Ahora ubiquemos tu régimen.",ops:[{l:"Una empresa, un negocio o una persona (patrón particular)",next:"resASinSeguro"},{l:"El gobierno o una institución pública",next:"gob"},{l:"No estoy seguro/a",next:"duda"}]},indep:{q:"¿Cómo cobras por tu trabajo?",ops:[{l:"Doy factura u honorarios, PERO en los hechos me dan órdenes, horario y trabajo solo para ellos",next:"resSimulacion"},{l:"Tengo mis propios clientes y yo pongo precios y condiciones",next:"resIndependiente"}]},quien:{q:"¿Quién te paga tu sueldo?",help:"No necesitas saber de leyes: piensa en quién firma tu recibo o de dónde viene tu pago.",ops:[{l:"Una empresa, un negocio o una persona (patrón particular)",next:"resA"},{l:"Me pagan una parte por nómina y otra parte 'por fuera': otra empresa, otra cuenta o en efectivo",next:"resEsquemaDividido"},{l:"El gobierno o una institución pública",next:"gob"},{l:"No estoy seguro/a",next:"duda"}]},gob:{q:"¿En qué parte del gobierno trabajas?",help:"Elige la que más se parezca a tu caso.",ops:[{l:"Una secretaría u oficina del Gobierno Federal (SEP, Salud, Bienestar, SAT…)",next:"resB"},{l:"El gobierno de mi estado o de mi municipio / alcaldía",next:"resBLocal"},{l:"IMSS, PEMEX o CFE",next:"resDesc"},{l:"Una universidad pública u otro organismo con nombre propio (un instituto, una comisión…)",next:"resISSSTEConfianza"},{l:"Soy policía, militar, marino, o trabajo en la Fiscalía / Ministerio Público",next:"resEsp"}]},duda:{q:"En tu recibo de pago o gafete, ¿aparece el escudo o logo de alguna dependencia de gobierno?",ops:[{l:"Sí, aparece un escudo o logo de gobierno",next:"gob"},{l:"No, aparece el nombre de una empresa o de una persona",next:"resA"},{l:"No me dan recibo de nada",next:"resAInformal"}]}},ff={resMercantil:{titulo:"Probablemente NO hay relación de trabajo",regimen:"NONE",intro:"La ley laboral protege a quien trabaja bajo las órdenes de alguien más. Si el negocio es tuyo y otros trabajan para ti, tú eres el patrón, no el trabajador.",partes:["Tus pleitos serían por la vía civil o mercantil, no por la laboral.","Ojo: tus trabajadores sí tienen frente a ti los derechos de esta app."],nota:"La calculadora y los plazos de esta app no aplican a tu caso.",fund:"Arts. 8 y 20 LFT: trabajador es quien presta un trabajo personal subordinado a cambio de un salario."},resIndependiente:{titulo:"Pareces trabajador independiente: la ley laboral podría no aplicarte",regimen:"NONE",intro:"Si tú decides tus clientes, tus precios, tus horarios y tu forma de trabajar, nadie te da órdenes. Sin eso no hay relación de trabajo protegida por la ley laboral.",partes:["Lo que te deban se reclama por la vía civil o mercantil, con tu contrato o tus facturas.","PERO si en los hechos alguien te da órdenes y horario, contesta de nuevo: podrías ser trabajador aunque te digan lo contrario."],nota:"Si tienes duda, un asesor puede revisar cómo trabajas EN LOS HECHOS. Eso es lo que cuenta, no el nombre del contrato.",fund:"Art. 20 LFT: la subordinación es el elemento esencial de la relación de trabajo."},resSimulacion:{titulo:"¡Aunque te hagan facturar, ERES trabajador!",regimen:"A",intro:"Lo que importa es la realidad, no el papel. Si te dan órdenes, cumples horario y trabajas solo para ellos, hay relación de trabajo. Aunque te paguen 'por honorarios' o te hayan hecho sacar un RFC.",partes:["Tienes derecho a todo lo de la ley: aguinaldo, vacaciones, prima, y finiquito o liquidación al terminar.","Guarda pruebas de que te daban órdenes: mensajes, horarios, gafete, correos, uniforme.","Puedes seguir con las demás pantallas: la calculadora sí es para ti."],nota:"Hacerte facturar para no darte prestaciones es un truco conocido. No te desanimes por el papeleo: los hechos pesan más.",fund:"Arts. 20 y 21 LFT: se presume la relación de trabajo entre quien presta un servicio personal y quien lo recibe, sin importar el nombre del contrato.",calc:!0},resSinPago:{titulo:"Trabajar sin que te paguen NO borra tus derechos",regimen:"A",intro:"Si ya trabajaste bajo las órdenes de alguien, la relación de trabajo existe. Los salarios se te deben, aunque nunca te hayan dado un peso.",partes:["Puedes reclamar los salarios de todo el tiempo trabajado y las prestaciones que marca la ley.","Si no acordaron cuánto, la ley toma como referencia por lo menos el salario mínimo.","Junta pruebas de que trabajaste: mensajes, testigos, fotos, registros de entrada."],nota:"Los salarios que no te pagaron se reclaman dentro de 1 año. No dejes pasar el tiempo.",fund:"Arts. 20, 21, 85 y 516 LFT.",calc:!0},resSubRegistro:{titulo:"Te registraron con un sueldo menor al que ganas: tus derechos se calculan con el real",regimen:"A",intro:"Registrarte ante el IMSS con menos de lo que ganas te pega directo: incapacidades más bajas, menos crédito del INFONAVIT y una pensión recortada. Pero fíjate en esto:",partes:["Tu finiquito o liquidación se calcula con lo que REALMENTE ganas, no con lo registrado. En la calculadora pon tu sueldo real.","Puedes denunciarlo ante el IMSS para que corrijan el sueldo con el que te tienen registrado. Es gratis.","Guarda pruebas de tu sueldo real: depósitos, transferencias, sobres, mensajes donde te lo confirmen.","En un juicio, al patrón le toca probar cuánto te pagaba. Tus estados de cuenta pesan mucho."],nota:"Que te registren con menos no te quita ni un peso de tus prestaciones. Al contrario: es otro incumplimiento a tu favor.",fund:"Art. 84 LFT (integración del salario); Art. 784, frac. XII, LFT (al patrón le corresponde probar el monto y el pago del salario); Art. 804 LFT (obligación patronal de conservar y exhibir recibos y listas de raya); Arts. 15, fracs. I y III, y 34 de la Ley del Seguro Social.",calc:!0},resEsquemaDividido:{titulo:"Te pagan dividido para recortarte derechos: tu sueldo es TODO lo que recibes",regimen:"A",intro:"Te pagan el mínimo por nómina y el resto por fuera: otra empresa, otra cuenta o en efectivo. Es un truco para achicar tu aguinaldo, vacaciones, IMSS y liquidación. La ley no se deja:",partes:["Tu sueldo es la SUMA de todo lo que recibes por tu trabajo, sin importar quién te lo pague. En la calculadora suma los dos pagos.","Quien recibe tu trabajo responde de tus derechos, aunque en el papel te pague otra empresa.","Guarda los dos flujos con fecha: los recibos de nómina y los depósitos del 'extra'.","Este truco suele venir junto con un registro menor al IMSS: eso también se puede denunciar."],nota:"Reclama con tu ingreso completo. Al patrón le tocará explicar el esquema, no a ti.",fund:"Art. 84 LFT (el salario incluye cualquier cantidad entregada por el trabajo); Arts. 12 a 15 LFT (responsabilidad de quien recibe los servicios); Art. 784, frac. XII, LFT (al patrón le corresponde probar el monto y el pago del salario); Art. 804 LFT (conservación y exhibición de recibos y listas de raya).",calc:!0},resASinSeguro:{titulo:"Te protege la LFT — y además te deben el IMSS y el INFONAVIT",regimen:"A",intro:"Que no te hayan asegurado no borra tu relación de trabajo: la vuelve más incumplida. Darte de alta en el IMSS y aportar al INFONAVIT es obligación del patrón desde tu primer día.",partes:["Tienes todos los derechos de la ley: aguinaldo, vacaciones, prima, y finiquito o liquidación al terminar.","Puedes exigir que te den de alta desde la fecha en que entraste, y denunciar la omisión ante el IMSS. Es gratis y puede ser confidencial.","Sin seguro, si te enfermas o te accidentas en el trabajo, el patrón responde directo de tu atención.","Guarda pruebas de la relación: recibos, transferencias, mensajes, testigos, fotos con uniforme o gafete."],nota:"La falta de alta al IMSS es un incumplimiento más que juega a tu favor. Sigue con las demás pantallas: la calculadora sí es para ti.",fund:"Arts. 20 y 21 LFT; Art. 15, fracción I, de la Ley del Seguro Social (obligación patronal de inscribir a los trabajadores); Art. 29 de la Ley del INFONAVIT.",calc:!0},resA:{titulo:"Te protege la Ley Federal del Trabajo (Apartado A)",regimen:"A",intro:"Trabajas para un patrón particular. Tu caso se rige por el Apartado A del artículo 123 de la Constitución y por la Ley Federal del Trabajo. Todas las herramientas de esta app son para ti.",partes:["Si tienes un problema, primero vas al Centro de Conciliación, donde intentan que lleguen a un arreglo. Si no lo hay, sigue el Tribunal Laboral.","Puedes usar la calculadora y la guía de plazos con confianza."],fund:"Art. 123, Apartado A, de la Constitución; Art. 1 de la Ley Federal del Trabajo.",calc:!0},resAInformal:{titulo:"Te protege la Ley Federal del Trabajo (Apartado A) — aunque no te den recibo",regimen:"A",intro:"Que no te den recibo, contrato o seguro NO significa que no tengas derechos. Si trabajas para una persona o un negocio particular, la Ley Federal del Trabajo te protege igual.",partes:["La relación de trabajo existe por el solo hecho de que prestas el servicio, aunque no haya papel firmado.","Guarda toda prueba: mensajes, transferencias, fotos con uniforme, testigos.","Puedes usar la calculadora y los plazos de esta app."],fund:"Arts. 20 y 21 LFT: la falta de contrato escrito es culpa del patrón y no te quita ningún derecho (Art. 26 LFT).",calc:!0},resISSSTE:{titulo:"Tu ISSSTE apunta al Apartado B: te rige la ley de los trabajadores del Estado",regimen:"B",intro:"El ISSSTE es la seguridad social de quienes trabajan para el Estado. Si eres de base, no te rige la Ley Federal del Trabajo, sino la de los trabajadores al servicio del Estado.",partes:["Tus reclamos van al Tribunal Federal de Conciliación y Arbitraje, no a los tribunales laborales comunes.","Como trabajador de base tienes más estabilidad: solo te pueden cesar por las causas que marca la ley y siguiendo un procedimiento.","Tus plazos son distintos, y más cortos de lo que la gente cree. Revisa la pantalla de plazos.","Tener ISSSTE es una señal muy fuerte. Pero lo que define tu régimen es quién te nombró y con qué figura, y eso conviene que lo revise un abogado."],nota:"La calculadora de esta app es para el Apartado A y NO aplica a tu caso: tus prestaciones y tiempos son otros. Déjanos tus datos aquí abajo y un abogado de Rescate Legal te asesora.",fund:"Art. 123, Apartado B, de la Constitución; Arts. 4, 5 y 8 de la Ley Federal de los Trabajadores al Servicio del Estado (última reforma DOF 15-01-2026)."},resISSSTEConfianza:{titulo:"Tu caso está entre dos leyes: hay que revisarlo con tus papeles en mano",regimen:"B_CONFIANZA",intro:"Tienes ISSSTE, así que trabajas para el Estado. Pero ser de confianza, o estar en una oficina del gobierno con nombre propio, te deja en medio de dos leyes. Eso no se contesta de memoria:",partes:["Los de confianza no tienen la misma estabilidad que los de base. Tu sueldo y tu seguridad social sí están protegidos.","En las oficinas del gobierno con nombre propio, la ley que te aplica depende del decreto que las creó y de tu contrato. No hay una regla única: cada organismo puede estar en el Apartado A o en el B.","Cuál ley te toca lo cambia todo: a qué tribunal vas, qué cobras y cuánto tiempo tienes para reclamar.","Junta tu nombramiento, tu contrato, tus recibos y el nombre exacto de donde trabajas."],nota:"No uses la calculadora para tu caso: está hecha para el Apartado A. Déjanos tus datos aquí abajo y un abogado de Rescate Legal revisa tu nombramiento y te dice qué ley te aplica.",fund:"Art. 123, Apartados A y B, de la Constitución; Arts. 5 y 8 de la Ley Federal de los Trabajadores al Servicio del Estado (última reforma DOF 15-01-2026); Art. 6 de la Ley del ISSSTE. Jurisprudencia P./J. 10/2021 (11a.), registro digital 2026908, Pleno de la SCJN, Undécima Época: el régimen laboral de cada organismo descentralizado se atiende a su decreto de creación y a sus contratos. Sustituye a la P./J. 1/96 (registro 200199)."},resB:{titulo:"Tu caso es del Apartado B (trabajadores del gobierno federal)",regimen:"B",intro:"Te rige la Ley Federal de los Trabajadores al Servicio del Estado, no la Ley Federal del Trabajo. Tus reclamos van al Tribunal Federal de Conciliación y Arbitraje.",nota:"La calculadora y los plazos de esta app son para el Apartado A y NO aplican a tu caso: tus prestaciones y tiempos son otros. Busca asesoría especializada.",fund:"Art. 123, Apartado B, de la Constitución; Ley Federal de los Trabajadores al Servicio del Estado."},resBLocal:{titulo:"Te rige la ley burocrática de tu estado",regimen:"B_LOCAL",intro:"Quienes trabajan para un gobierno estatal o municipal se rigen por la ley del servicio civil de cada estado, ante su propio tribunal local.",nota:"La calculadora y los plazos de esta app son para la Ley Federal del Trabajo y pueden no coincidir con tu ley estatal. Verifícalo con un asesor de tu estado.",fund:"Arts. 115, 116 (frac. VI) y 123 de la Constitución: cada estado expide su propia ley para sus trabajadores."},resDesc:{titulo:"¡Buena noticia! Te protege la Ley Federal del Trabajo (Apartado A)",regimen:"A",intro:"El IMSS, PEMEX y CFE tienen su propia ley, y esa ley pone sus relaciones de trabajo en el Apartado A. Todas las herramientas de esta app son para ti.",partes:["Puedes usar la calculadora y la guía de plazos con confianza.","Revisa también tu Contrato Colectivo: en estas instituciones suele dar bastante más de lo que marca la ley.","Ojo si trabajas en otro organismo público con nombre propio: ahí no hay regla general. Cada uno puede estar en el Apartado A o en el B, según el decreto que lo creó."],fund:"Art. 123, Apartado A, de la Constitución, y las leyes propias del IMSS, de Petróleos Mexicanos y de la Comisión Federal de Electricidad, que ubican sus relaciones de trabajo en el Apartado A. Para los demás organismos descentralizados: jurisprudencia P./J. 10/2021 (11a.), registro digital 2026908, Pleno de la SCJN, Undécima Época (sustitución de jurisprudencia 2/2020, resuelta el 11 de octubre de 2021, obligatoria desde el 31 de enero de 2022): existe libertad configurativa para fijar en la ley o en el decreto de creación si el organismo se rige por el Apartado A o por el B. Deja sin efectos el criterio anterior P./J. 1/96 (registro 200199).",calc:!0},resEsp:{titulo:"Tu caso es de régimen especial",regimen:"ESP",intro:"Policías, militares, marinos, agentes del Ministerio Público y peritos se rigen por sus propias leyes. No les aplica la Ley Federal del Trabajo ni la ley de los trabajadores del Estado.",nota:"En estos casos no te pueden regresar a tu trabajo: si la separación fue injustificada, solo procede un pago. El reclamo se lleva por la vía administrativa. Esta app no cubre tu régimen; necesitas asesoría especializada.",fund:"Art. 123, Apartado B, fracción XIII, de la Constitución."}},mf={inicio:{q:"¿Cómo terminó (o está terminando) tu trabajo?",help:"Elige lo que pasó en los hechos, sin pensar en términos legales.",ops:[{l:"Me corrieron, me dijeron que ya no fuera, o ya no me dejan entrar",next:"corrido"},{l:"Yo ya me salí",next:"mefui"},{l:"Sigo trabajando, pero ya me quiero ir",next:"quiero"},{l:"Me pidieron firmar mi renuncia o papeles en blanco",next:"presion"},{l:"Es por mi enfermedad, por mis incapacidades del IMSS o porque necesito permisos para atenderme",next:"salud"},{l:"Es por mi embarazo, por razones de género o por acoso sexual",next:"genero"},{l:"Llegamos a un acuerdo para terminar por las buenas",next:"resMutuo"}]},corrido:{q:"Cuando te corrieron, ¿te entregaron un escrito firmado explicando la causa exacta y la fecha?",help:"Debe ser un documento formal (aviso de rescisión), no un mensaje de WhatsApp ni de palabra.",ops:[{l:"No me dieron nada por escrito",next:"resDespidoInj"},{l:"Sí me dieron un escrito con la causa",next:"corridoConAviso"}]},salud:{q:"¿Cómo estás hoy en ese trabajo?",help:"Primero lo más importante: si ya te corrieron o si sigues yendo. Después revisamos tus papeles del IMSS.",ops:[{l:"Ya me corrieron, o ya no me dejan entrar",next:"saludPapeles"},{l:"Sigo trabajando, pero me presionan para que renuncie",next:"resSaludPresion"},{l:"Sigo trabajando y quiero saber qué me protege",next:"resSaludDerechos"}]},saludPapeles:{q:"¿Qué te ha dado el IMSS por escrito?",help:"El dictamen es distinto de la incapacidad: es la hoja donde el IMSS resuelve si puedes o no seguir trabajando. Si no sabes si lo tienes, elige la segunda opción.",ops:[{l:"El IMSS ya dictaminó que no puedo seguir trabajando",next:"saludOrigen"},{l:"Tengo incapacidades o un diagnóstico, pero no un dictamen así",next:"resSaludDespido"},{l:"No tengo nada del IMSS por escrito",next:"resSaludDespido"}]},saludOrigen:{q:"Ese dictamen, ¿de dónde viene?",help:"Si el daño lo causó el trabajo —un accidente ahí, en el camino de tu casa al trabajo, o una enfermedad que te provocó tu labor— la ley te da más. Esto cambia lo que te toca cobrar.",ops:[{l:"De un accidente en el trabajo, en el camino, o de una enfermedad que me causó mi trabajo",next:"resSaludRiesgo"},{l:"De una enfermedad o un accidente de fuera del trabajo",next:"resSaludArt54"},{l:"No sé de dónde vino",next:"resSaludRevisar"}]},causa47:{q:"¿Qué dice el escrito que hiciste?",help:"La ley trae una lista cerrada: solo estas conductas permiten despedir sin pagar indemnización. Si lo tuyo no está aquí, tu despido se pelea. Elige lo que más se parezca.",ops:[{l:"Al entrar di documentos o referencias falsas sobre mi preparación, y llevo menos de 30 días trabajando",next:"resDespidoJus"},{l:"Golpeé, amenacé, insulté o maltraté al patrón, a su familia, a un jefe, a un cliente o a un proveedor",next:"resDespidoJus"},{l:"Hice eso mismo contra un compañero, y por eso se alteró el orden en el trabajo",next:"resDespidoJus"},{l:"Hice eso mismo fuera del trabajo contra el patrón, su familia o un jefe, y fue muy grave",next:"resDespidoJus"},{l:"Dañé a propósito el edificio, la maquinaria, las herramientas o el material",next:"resDespidoJus"},{l:"Causé esos daños sin querer, pero por un descuido tan grave que fue la única razón del daño",next:"resDespidoJus"},{l:"Por una imprudencia o un descuido imperdonable puse en riesgo el lugar o a las personas",next:"resDespidoJus"},{l:"Cometí actos inmorales, hostigamiento o acoso sexual contra alguien en el trabajo",next:"resDespidoJus"},{l:"Revelé secretos de fabricación o asuntos reservados y perjudiqué a la empresa",next:"resDespidoJus"},{l:"Falté más de 3 veces en 30 días, sin permiso y sin justificante",next:"resDespidoJus"},{l:"Desobedecí al patrón o a un jefe, sin causa justificada, en algo del trabajo para el que me contrataron",next:"resDespidoJus"},{l:"Me negué a usar las medidas de seguridad o a seguir los procedimientos contra accidentes",next:"resDespidoJus"},{l:"Llegué a trabajar borracho o drogado, sin haber avisado antes de una receta médica",next:"resDespidoJus"},{l:"Un juez me dictó sentencia firme de cárcel y por eso no puedo trabajar",next:"resDespidoJus"},{l:"Me faltaron documentos que la ley exige para el trabajo, y fue por causa mía",next:"resDespidoJus"},{l:"Ninguna de estas: el escrito dice otra cosa",next:"resCausaFueraDeLista"}]},corridoConAviso:{q:"Lo que dice ese escrito, ¿es verdad y realmente lo hiciste?",ops:[{l:"No es cierto / está exagerado / no estoy de acuerdo",next:"resDespidoImpugnable"},{l:"Sí es cierto",next:"causa47"}]},mefui:{q:"¿Por qué decidiste irte?",ops:[{l:"Encontré otro trabajo / motivos personales / ya no quise seguir",next:"resRenuncia"},{l:"Dejaron de pagarme, me bajaron el sueldo, me cambiaron de lugar o me trataban mal",next:"mefuiCausa"}]},mefuiCausa:{q:"¿Hace cuánto empezó ese problema (la falta de pago, el maltrato, el cambio)?",help:"La ley te da 30 días desde que ocurre la causa para separarte con derecho a indemnización.",ops:[{l:"Empezó hace menos de 30 días, y por eso me salí",next:"resRescTrab"},{l:"Empezó hace más de 30 días, pero siguió repitiéndose hasta que me salí",next:"resRescTrabContinua"},{l:"Ya me salí hace bastante tiempo",next:"resRescTrabVerificar"}]},quiero:{q:"¿Por qué te quieres ir?",help:"Tu respuesta cambia MUCHO lo que te toca cobrar. Contesta con calma.",ops:[{l:"Encontré algo mejor / motivos personales / simplemente ya no quiero seguir",next:"resQuieroRenunciar"},{l:"No me pagan completo, me bajaron el sueldo, me cambiaron condiciones o me tratan mal",next:"resNoRenuncies"},{l:"Me están presionando para que firme mi renuncia",next:"presion"}]},genero:{q:"Cuéntanos qué está pasando",help:"Estos casos tienen protección REFORZADA en la ley. Elige lo que más se parezca al tuyo.",ops:[{l:"Me despidieron estando embarazada (o al volver de mi incapacidad de maternidad)",next:"resEmbarazo"},{l:"Me presionan para renunciar por mi embarazo",next:"resEmbarazoPresion"},{l:"Me pagan menos o me tratan peor por ser mujer o por mi identidad de género",next:"resGenero"},{l:"Sufro acoso u hostigamiento sexual en el trabajo",next:"resAcoso"}]},presion:{q:"¿Ya firmaste esos papeles?",ops:[{l:"No he firmado nada",next:"resNoFirmes"},{l:"Sí, ya firmé",next:"resFirmoPresion"}]}},gf={resDespidoInj:{titulo:"Esto es un DESPIDO INJUSTIFICADO: te toca LIQUIDACIÓN completa",intro:"El patrón no te entregó un aviso por escrito con la razón del despido. Sin ese aviso, la ley da por hecho que te despidió sin causa. Te corresponde:",partes:["Tu finiquito completo: días trabajados sin pagar, la parte del aguinaldo, vacaciones y prima vacacional.","Prima de antigüedad: 12 días de sueldo por cada año trabajado (la ley le pone un tope).","3 meses de sueldo, que la ley llama indemnización. No es el sueldo solo: se le suma lo que te dan además (vales, bonos, la parte del aguinaldo).","Si demandas y ganas, también te pagan los sueldos que dejaste de ganar, hasta por 12 meses.","Y si el juicio se alarga más de esos 12 meses, siguen corriendo intereses a tu favor: 2% al mes sobre 15 meses de tu sueldo, que se van sumando al capital."],nota:"Tienes solo 2 MESES desde el despido para reclamar. Revisa la sección '¡Ojo con los plazos!'.",fund:"Arts. 47 (último párrafo: sin aviso escrito, el despido se presume injustificado), 48 (salarios vencidos hasta por 12 meses y, en adelante, intereses del 2% mensual capitalizable sobre el importe de 15 meses de salario) y 50 LFT.",calc:!0,tipo:"DESPIDO_INJ"},resDespidoImpugnable:{titulo:"Puedes pelearlo como DESPIDO INJUSTIFICADO",intro:"Que te hayan dado un papel no quiere decir que la razón sea válida: el patrón tiene que probarla. Si es falsa o está exagerada, el despido cuenta como injustificado:",partes:["Te tocaría tu finiquito completo, la prima de antigüedad y 3 meses de sueldo.","No firmes nada que diga que estás de acuerdo con la razón del despido.","Guarda el aviso que te dieron: es una prueba clave."],nota:"El plazo para reclamar es de 2 MESES. No lo dejes pasar.",fund:"Arts. 47 y 48 LFT: la carga de probar la causa del despido es del patrón.",calc:!0,tipo:"DESPIDO_INJ"},resDespidoJus:{titulo:"Despido con causa: te toca FINIQUITO + prima de antigüedad",intro:"Aunque la razón del despido sea cierta, no te vas con las manos vacías. Te deben pagar:",partes:["Los días que trabajaste y no te pagaron.","La parte del aguinaldo que te tocó este año.","Las vacaciones que no tomaste, más su prima del 25%.","Prima de antigüedad: 12 días de sueldo por año, sin importar cuántos años llevabas."],fund:"Arts. 79, 80, 87 y 162 (frac. III) LFT: la prima de antigüedad se paga aunque el despido sea justificado.",calc:!0,tipo:"DESPIDO_JUS"},resRenuncia:{titulo:"Renuncia voluntaria: te toca tu FINIQUITO",intro:"Renunciar no borra lo que ya trabajaste. Te deben pagar:",partes:["Los días que trabajaste y todavía no te pagan.","La parte del aguinaldo que te tocó este año.","Las vacaciones que no tomaste, más su prima del 25%.","Prima de antigüedad, pero solo si trabajaste 15 años o más."],nota:"No te tocan los 3 meses de sueldo. Esos son solo cuando el patrón termina la relación sin una razón válida.",fund:"Arts. 79, 80, 82, 87 y 162 (frac. III) LFT.",calc:!0,tipo:"RENUNCIA"},resRescTrab:{titulo:"Te saliste con causa: te toca LIQUIDACIÓN completa",intro:"Cuando el patrón incumple —no te paga, te baja el sueldo, te maltrata— la ley te permite salirte. Y cobras lo mismo que en un despido injustificado:",partes:["Te toca tu finiquito completo, la prima de antigüedad y 3 meses de sueldo.","Junta pruebas desde hoy: recibos, estados de cuenta, mensajes, testigos.","Cuando te llamen a firmar tu finiquito, no firmes una renuncia normal.","El papel que firmes debe decir que te saliste por culpa del patrón. Si no lo dice, pierdes los 3 meses."],nota:"Tus 30 días para salirte ya los cumpliste. Ahora corre otro plazo: 2 meses desde tu último día para reclamar. En la sección de plazos te decimos cuántos te quedan.",fund:"Arts. 51 y 52 LFT: el trabajador que se separa por causa imputable al patrón tiene derecho a la indemnización del Art. 50. Art. 518 LFT: 2 meses para reclamar, desde la separación.",calc:!0,tipo:"RESC_TRAB"},resRescTrabContinua:{titulo:"Todavía puedes cobrar LIQUIDACIÓN, pero el tiempo corre",intro:"A veces el incumplimiento se repite: cada quincena que no te pagan completo, por ejemplo. Cada vez que vuelve a pasar, tu plazo de 30 días puede reiniciarse. Es un punto fino:",partes:["Lo que cuenta es la fecha del ÚLTIMO incumplimiento, no la del primero. Desde ahí se cuentan tus 30 días.","Anota cada incumplimiento con su fecha: recibos, capturas, transferencias.","Si te saliste dentro del plazo, te tocaría tu finiquito, la prima de antigüedad y 3 meses de sueldo."],nota:"En estos casos las fechas deciden si cobras 3 meses o nada. Lleva tus pruebas con un abogado cuanto antes.",fund:"Arts. 51, 52 y 517 (frac. II) LFT.",calc:!0,tipo:"RESC_TRAB"},resRescTrabVerificar:{titulo:"Hay que revisar tus fechas con cuidado",intro:"Si ya te saliste hace tiempo, lo importante es cuándo. Para reclamar por tu salida tienes 2 meses, contados desde el último día que fuiste a trabajar.",partes:["Si todavía estás dentro de los 2 meses, puedes reclamar los 3 meses de sueldo completos. Ve a la sección de plazos.","Si ya pasaron, esos 3 meses pueden haberse vencido. Pero los sueldos, el aguinaldo y las vacaciones que no te pagaron se reclaman hasta por 1 año."],fund:"Arts. 516 y 518 LFT.",calc:!0,tipo:"RESC_TRAB"},resQuieroRenunciar:{titulo:"Puedes renunciar, pero hazlo bien y cobra tu FINIQUITO",intro:"Renunciar es tu derecho y no tienes que dar explicaciones. Antes de entregar tu renuncia, prepárate para no dejar dinero sobre la mesa:",partes:["Primero usa la calculadora. Ese número es lo MÍNIMO que te tienen que dar: si te ofrecen menos, te están quedando a deber.","Entrega tu renuncia por escrito y con fecha. Quédate con el acuse o una foto del recibido.","Te deben pagar: días trabajados, la parte del aguinaldo, vacaciones no tomadas y su prima del 25%.","Prima de antigüedad, solo si cumpliste 15 años o más.","El finiquito se paga al terminar, no 'cuando la empresa pueda'."],nota:"Renuncia a tu trabajo, no a tus derechos. No firmes hojas en blanco ni cantidades que no cuadren con tu cálculo.",fund:"Arts. 33, 79, 80, 82, 87 y 162 (frac. III) LFT.",calc:!0,tipo:"RENUNCIA",vigente:!0},resNoRenuncies:{titulo:"¡ESPERA! No renuncies todavía: podrías cobrar LIQUIDACIÓN completa",intro:"Si el que incumple es el patrón, renunciar de la forma normal le regala tus 3 meses de sueldo. Hay una salida mejor: salirte con causa y cobrar como si te hubieran despedido.",partes:["Saliéndote por culpa del patrón te tocaría tu finiquito, la prima de antigüedad y 3 meses de sueldo.","Tienes 30 DÍAS desde cada incumplimiento para salirte por esta vía.","Desde hoy guarda todo: recibos incompletos, estados de cuenta, mensajes, testigos, cambios de horario o de puesto.","No firmes ninguna renuncia mientras tanto: una renuncia normal borra los 3 meses.","Asesórate ANTES de salirte. La forma y la fecha de tu salida deciden si cobras 3 meses o nada."],nota:"Este es el error más caro que se comete: renunciar enojado teniendo derecho a liquidación.",fund:"Arts. 51, 52, 50 y 517 (frac. II) LFT.",calc:!0,tipo:"RESC_TRAB",vigente:!0},resNoFirmes:{titulo:"¡NO FIRMES NADA todavía!",intro:"Nadie puede obligarte a renunciar. Si firmas una renuncia 'voluntaria', pierdes el derecho a los 3 meses de sueldo.",partes:["No firmes hojas en blanco ni papeles que no te dejen leer con calma.","Si te impiden entrar a trabajar sin que hayas firmado, eso ya es un despido. Anota fecha, hora y testigos.","Pide copia de todo lo que te muestren.","Puedes decir: 'lo voy a revisar con un asesor'. Es tu derecho."],nota:"Presionar a alguien para que renuncie es una forma de no pagarle su liquidación. Desde el despido tienes 2 meses para reclamar.",fund:"Arts. 33 (la renuncia de derechos es nula), 47 y 48 LFT.",calc:!0,tipo:"DESPIDO_INJ",vigente:!0},resFirmoPresion:{titulo:"Firmaste bajo presión: todavía puede haber camino",intro:"Una renuncia firmada con engaño o bajo presión se puede pelear, aunque es más difícil: te toca a ti demostrar que te presionaron.",partes:["Reúne todo lo que muestre cómo te hicieron firmar: mensajes, correos, testigos.","Si te deben aguinaldo, vacaciones o días trabajados, eso se reclama de todos modos. Firmar la renuncia no lo borra.","Acude con un abogado lo antes posible: el plazo de 2 meses corre."],fund:"Art. 33 LFT: es nula la renuncia de derechos ya ganados, aunque esté firmada.",calc:!0,tipo:"RENUNCIA"},resEmbarazo:{sensible:!0,titulo:"Despedirte embarazada se presume discriminación: tienes la protección más fuerte de la ley",intro:"La Suprema Corte ha resuelto que despedir a una trabajadora embarazada se presume discriminación. Le toca al PATRÓN probar que no lo fue. Tus derechos van más allá de una liquidación normal:",partes:["Puedes pedir que te regresen a tu trabajo con los sueldos que dejaste de ganar. O bien tu finiquito, la prima de antigüedad y 3 meses de sueldo.","Tu caso va DIRECTO A DEMANDA: no tienes que pasar por la conciliación prejudicial ante el Centro de Conciliación (revisa la pantalla de plazos).","También puedes reclamar un pago por el daño de la discriminación.","Pedirte un certificado de no embarazo, o ponerte condiciones por estarlo, también es ilegal.","No firmes renuncia ni acuerdo. Junta pruebas: constancias médicas, la fecha del despido, mensajes, testigos."],nota:"El plazo de 2 meses corre igual. Con un caso tan fuerte, lo peor es dejarlo enfriar.",fund:"Arts. 1o. y 123 constitucionales; Arts. 2o., 3o., 56, 133 (fracs. XIV y XV) y 685 Ter, frac. I, LFT; jurisprudencia de la SCJN sobre presunción de despido discriminatorio por embarazo.",calc:!0,tipo:"DESPIDO_INJ"},resEmbarazoPresion:{sensible:!0,titulo:"No renuncies: estando embarazada tienes protección reforzada",intro:"Presionarte para que renuncies por tu embarazo es discriminación. Si aguantas la presión, conservas todos tus derechos. Si firmas, se los regalas:",partes:["No te pueden poner a hacer trabajos que arriesguen tu salud, y te deben pagar tu sueldo completo.","Te toca tu incapacidad de maternidad pagada: 6 semanas antes del parto y 6 después. Al volver, tus periodos de lactancia.","No firmes renuncia, acuerdos ni hojas en blanco, aunque insistan.","Guarda pruebas de la presión: mensajes, correos, testigos, cambios repentinos de horario o de tareas.","Si te despiden, se presumirá discriminación. Podrás pedir que te regresen a tu trabajo, directo ante el Tribunal."],nota:"Cada día que aguantas sin firmar, tu caso se hace más fuerte. Busca asesoría desde ahora.",fund:"Arts. 133 (fracs. XIV y XV), 166, 170 y 685 Ter LFT; Art. 1o. constitucional.",calc:!0,tipo:"DESPIDO_INJ",vigente:!0},resGenero:{sensible:!0,titulo:"Pagarte menos o tratarte peor por tu género es discriminación, y se reclama",intro:"A trabajo igual, salario igual. Es un principio de la ley, no una aspiración. Tratarte distinto por ser mujer, por tu identidad de género o por tu orientación está prohibido:",partes:["Puedes reclamar las diferencias de sueldo de hasta 1 año hacia atrás.","Si la situación te obliga a salirte, puedes hacerlo por culpa del patrón y cobrar liquidación completa. No renuncies de la forma normal.","Si te despiden por reclamar, ese despido va directo a demanda, sin pasar por la conciliación prejudicial ante el Centro de Conciliación.","Junta pruebas: tu sueldo comparado con el de compañeros del mismo puesto, mensajes, evaluaciones, testigos."],nota:"Comparar salarios no es ilegal ni motivo de despido. Es exactamente la prueba que necesitas.",fund:"Arts. 1o. constitucional; 2o., 3o., 56, 86 y 685 Ter LFT; Art. 516 LFT (1 año para diferencias salariales).",calc:!0,tipo:"RESC_TRAB",vigente:!0},resAcoso:{sensible:!0,titulo:"El acoso sexual en el trabajo es ilegal, y no es tu culpa",intro:"Ningún puesto, favor ni 'ambiente de trabajo' justifica el acoso u hostigamiento sexual. La ley te protege por varias vías al mismo tiempo:",partes:["Puedes salirte por culpa del patrón y cobrar liquidación completa: finiquito, prima de antigüedad y 3 meses de sueldo.","Aplica si el acoso viene del patrón, de sus familiares o de su personal.","Tu caso va DIRECTO A DEMANDA: el acoso sexual es una de las excepciones a la conciliación prejudicial ante el Centro de Conciliación.","El patrón está OBLIGADO a tener un protocolo contra el acoso. Que no exista, o que lo ignore, lo hace más responsable.","Si tú lo decides, además puedes denunciar por la vía penal. Una cosa no cancela la otra.","Guarda pruebas en un lugar seguro: mensajes, capturas con fecha, correos, testigos y los reportes que hiciste en la empresa."],nota:"Si estás en riesgo, tu seguridad va primero. Busca apoyo y asesoría antes de confrontar o de renunciar: la forma de tu salida define lo que cobras.",fund:"Arts. 3o. Bis, 47 (frac. VIII) y 51 (fracs. II y III), 132 (frac. XXXI) y 685 Ter LFT.",calc:!0,tipo:"RESC_TRAB",vigente:!0},resCausaFueraDeLista:{titulo:"Lo que te achacan puede no ser causa legal para despedirte",intro:"La ley trae una lista cerrada de conductas. Solo esas permiten despedir sin pagar indemnización. Si lo que dice tu escrito no está ahí, el despido se pelea como injustificado:",partes:["Te tocaría tu finiquito completo, la prima de antigüedad y 3 meses de sueldo.","Al patrón no le basta con probar que pasó: también tiene que probar que eso es una de las causas que marca la ley.","Guarda el escrito que te dieron. Si la razón que menciona no es de la lista, ese papel juega a tu favor.","No firmes nada donde aceptes la razón del despido."],nota:"Que no cumples el perfil, que no hay trabajo, que bajaron las ventas o que no encajas en el equipo NO son causas legales de despido. Tienes 2 MESES para reclamar.",fund:"Art. 47 LFT: las causas de rescisión sin responsabilidad para el patrón son las que ahí se enumeran, de manera limitativa; Arts. 48 y 50 LFT (la carga de probar la causa es del patrón).",calc:!0,tipo:"DESPIDO_INJ"},resSaludDespido:{sensible:!0,titulo:"Correrte por estar enfermo es despido injustificado, y además puede ser discriminación",intro:"Estar enfermo no es una causa legal de despido. Y las faltas que cubre una incapacidad del IMSS son faltas justificadas: no cuentan para correrte:",partes:["Te toca tu finiquito completo, la prima de antigüedad y 3 meses de sueldo.","Pide al IMSS copia de todas tus incapacidades y de tu expediente. Son tu prueba principal.","Junta también los permisos que pediste, los mensajes donde avisaste y los comprobantes de tus citas.","Si te despidieron por tu salud, además puedes reclamar por discriminación: eso va directo a demanda, sin pasar por la conciliación prejudicial ante el Centro de Conciliación.","No firmes renuncia ni acuerdo mientras no lo revise un abogado."],nota:"Aunque no tengas todavía los papeles, pídelos: el IMSS te los da. Y no dejes correr el plazo, que es de 2 MESES desde el despido.",fund:"Arts. 47 (frac. X, a contrario: la falta amparada por incapacidad es justificada), 133 (frac. I) y 685 Ter LFT; Art. 1o. constitucional; Arts. 48 y 50 LFT.",calc:!0,tipo:"DESPIDO_INJ"},resSaludPresion:{sensible:!0,titulo:"No renuncies por estar enfermo: si te corren por eso, te toca LIQUIDACIÓN completa",intro:"Presionarte para que renuncies por tu enfermedad o por tus incapacidades es discriminación. Si aguantas sin firmar, conservas todos tus derechos:",partes:["No firmes renuncia, acuerdos ni hojas en blanco, aunque insistan.","Las faltas que cubre una incapacidad del IMSS son justificadas: no las pueden usar para correrte.","Guarda cada incapacidad, cada permiso y cada mensaje donde te presionen. Con fecha.","Si te corren, sería despido injustificado: finiquito completo, prima de antigüedad y 3 meses de sueldo.","Tu patrón está obligado a cuidar tu salud en el trabajo, no a deshacerse de ti por estar enfermo."],nota:"Cada día que aguantas sin firmar, tu caso se hace más fuerte. Busca asesoría desde ahora, sin esperar al despido.",fund:"Arts. 33, 133 (frac. I) y 685 Ter LFT; Art. 1o. constitucional; Arts. 48 y 50 LFT.",calc:!0,tipo:"DESPIDO_INJ",vigente:!0},resSaludDerechos:{sensible:!0,titulo:"Estar enfermo no te quita derechos: esto es lo que te protege",intro:"Mientras sigas trabajando, la ley te cubre por varios lados a la vez:",partes:["Las faltas que cubre una incapacidad del IMSS son justificadas. No pueden contarlas para correrte.","Tienes derecho a los permisos que necesites para tus consultas y tus tratamientos.","Tu patrón no puede tratarte peor, bajarte el sueldo ni cambiarte de puesto por estar enfermo.","Si el daño lo causó tu trabajo, se llama riesgo de trabajo y te da derechos aparte: estando asegurado te cubre el IMSS; si tu patrón no te dio de alta, responde él.","Guarda todo desde ahora: incapacidades, recetas, citas y los permisos que pidas."],nota:"El cálculo de abajo es una proyección: te dice qué te tocaría SI te despidieran hoy sin razón. Todavía no te deben ese dinero.",fund:"Arts. 47 (frac. X), 132 (fracs. XVI a XIX Bis), 133 (frac. I) y 473 y siguientes LFT.",calc:!0,tipo:"DESPIDO_INJ",vigente:!0},resSaludRiesgo:{sensible:!0,titulo:"Fue riesgo de trabajo: eso te abre derechos aparte de tu despido",intro:"Que el daño lo haya causado el trabajo cambia las cosas a tu favor. Pero de dónde sale ese pago depende de si tu patrón te tenía dado de alta en el IMSS:",partes:["Por el despido: tu finiquito completo, la prima de antigüedad y 3 meses de sueldo. Es lo que calcula esta app.","Si estabas dado de alta: el IMSS toma el lugar de tu patrón. Te cubre con incapacidades y, según el grado que te dictaminen, con una pensión. No es un pago del patrón.","Si tu patrón NO te dio de alta: entonces sí le toca a él responder por el riesgo, y encima el IMSS le cobra lo que gastó en atenderte.","Pide al IMSS el formato ST-7 (accidente) o ST-9 (enfermedad de trabajo) y tu dictamen de incapacidad.","Si tu patrón no reportó el accidente al IMSS, eso es un incumplimiento suyo y juega a tu favor.","El accidente de camino entre tu casa y el trabajo también cuenta como riesgo de trabajo."],nota:"Que estuvieras asegurado y que el IMSS haya tomado su lugar es algo que el patrón tiene que probar, no tú. Nada de esto aparece en el cálculo de abajo: déjanos tus datos y un abogado lo revisa por separado.",fund:"Arts. 473, 474, 475, 487, 491 a 495 y 513 LFT (tabla de valuación de incapacidades); Art. 53 de la Ley del Seguro Social (el patrón que aseguró a sus trabajadores contra riesgos de trabajo queda relevado de las obligaciones que por esa clase de riesgos le impone la LFT) y Art. 77 de la misma Ley (capitales constitutivos a cargo del patrón que no aseguró); Arts. 48 y 50 LFT por el despido.",calc:!0,tipo:"DESPIDO_INJ"},resSaludArt54:{sensible:!0,titulo:"Con dictamen del IMSS por enfermedad de fuera del trabajo, la cuenta es distinta",intro:"Cuando el IMSS dictamina que ya no puedes trabajar y la causa no vino del trabajo, la ley no manda los 3 meses. Manda otra cosa:",partes:["Un mes de sueldo, más 12 días de sueldo por cada año que trabajaste.","Además de tu finiquito completo: días trabajados, la parte del aguinaldo, vacaciones y prima vacacional.","En lugar de que te liquiden, puedes pedir que te den otro puesto compatible con tu estado de salud. Es tu decisión, no la del patrón.","Esto es aparte de tu pensión o tus prestaciones del IMSS, que se tramitan por su cuenta.","Guarda tu dictamen: es el documento que decide cuál de las dos cuentas te aplica."],nota:"Ojo: si el dictamen dice que sí puedes seguir trabajando y aun así te corrieron, esto no aplica y tu caso es un despido injustificado de 3 meses. Que un abogado lea tu dictamen antes de aceptar cualquier cantidad.",fund:"Arts. 53 (frac. IV) y 54 LFT: si la incapacidad proviene de un riesgo no profesional, un mes de salario y doce días por año conforme al Art. 162, o bien otro empleo compatible; Art. 89 LFT (las indemnizaciones se pagan con salario integrado).",calc:!0,tipo:"INCAP_ART54"},resSaludRevisar:{sensible:!0,titulo:"De dónde venga tu incapacidad cambia lo que cobras: hay que revisarlo",intro:"Tu dictamen dice que ya no puedes trabajar, pero falta saber si el daño vino del trabajo. De eso dependen dos cuentas muy distintas:",partes:["Si vino del trabajo: tu liquidación completa con 3 meses de sueldo, más la cobertura por el riesgo, que corre por el IMSS si estabas asegurado o por tu patrón si no te dio de alta.","Si vino de fuera del trabajo: un mes de sueldo más 12 días por año, sin los 3 meses.","Lo que decide es tu dictamen y tu expediente del IMSS. Pídelos completos.","Si tu trabajo pudo causar o agravar tu enfermedad, dilo: puede reclasificarse como enfermedad de trabajo."],nota:"El cálculo de abajo usa la cuenta del despido injustificado. Si resulta que tu incapacidad viene de fuera del trabajo, la cifra cambia. No aceptes ninguna cantidad sin que un abogado lea tu dictamen.",fund:"Arts. 53 (frac. IV), 54, 473 a 475 y 513 LFT.",calc:!0,tipo:"DESPIDO_INJ"},resMutuo:{titulo:"Terminación de común acuerdo: FINIQUITO + prima de antigüedad",intro:"Terminar por las buenas está permitido, pero el acuerdo tiene que respetar lo que ya ganaste:",partes:["Días trabajados, la parte del aguinaldo, vacaciones y prima vacacional.","Prima de antigüedad, conforme a la ley.","El acuerdo debe ser por escrito y con cantidades claras.","Renunciar a un derecho que ya ganaste no vale, aunque lo firmes."],nota:"Antes de firmar, usa la calculadora: así sabrás si lo que te ofrecen es justo.",fund:"Arts. 33, 53 (frac. I) y 162 LFT.",calc:!0,tipo:"DESPIDO_JUS"}};function hf(){var s,i,u,h;const[e,n]=Le.useState("inicio"),[t,r]=Le.useState(null),[a,o]=Le.useState(null),l=()=>{r(null),o(null),n("inicio")};return e==="inicio"?f.jsxs("div",{className:"widget",children:[f.jsx(xa,{titulo:"Calculadora laboral"}),f.jsxs("div",{className:"card portada",children:[f.jsx("h2",{className:"preg",style:{fontSize:24},children:"¿Cuánto te deben cuando termina tu trabajo?"}),f.jsx("p",{className:"res-intro",children:"Contesta unas preguntas de hechos —sin saber de leyes— y sabrás qué ley te protege, si te toca finiquito o liquidación, y cuánto es aproximadamente."}),f.jsxs("ul",{className:"res-lista",style:{marginTop:4},children:[f.jsx("li",{children:"Gratis y sin registrarte."}),f.jsx("li",{children:"Con el fundamento legal de cada conclusión."}),f.jsx("li",{children:"Cálculo conforme a la Ley Federal del Trabajo vigente."})]}),f.jsx("div",{className:"nav",children:f.jsx("button",{className:"b b-oro",onClick:()=>n("test1
